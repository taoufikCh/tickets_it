{% extends 'base.html' %}{% block title %}Connexion{% endblock %}{% block mainclass %}narrow{% endblock %}
{% block content %}
<h1>Espace technicien</h1><p class="lead">Connectez-vous pour gérer les tickets.</p>
<form method="post" class="panel" style="max-width:380px"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="username" style="margin-top:0">Identifiant</label><input id="username" name="username" autocomplete="username" autofocus required>
<label for="password">Mot de passe</label><input id="password" type="password" name="password" autocomplete="current-password" required>
<p style="margin:18px 0 0"><button class="btn">Se connecter</button></p></form>
{% endblock %}
